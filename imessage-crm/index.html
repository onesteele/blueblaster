<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deliveredBlue CRM</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.08) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(52, 199, 89, 0.06) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #root {
            position: relative;
            z-index: 1;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }

        /* Glass card base */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

        /* Checkbox */
        .checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .checkbox.checked {
            background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
            border-color: #007AFF;
        }

        /* Contact list item */
        .contact-list-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .contact-list-item:hover {
            background: rgba(0, 122, 255, 0.04);
        }
        .contact-list-item.selected {
            background: rgba(0, 122, 255, 0.08);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid rgba(0, 0, 0, 0.06);
            overflow-y: auto;
            padding: 16px;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.25s ease-out;
        }

        input, textarea, select {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        button {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">Loading deliveredBlue CRM...</div>
    </div>

    <script>
        // Auth check
        const authToken = sessionStorage.getItem('imessage_crm_auth');
        if (authToken !== 'true') {
            window.location.href = 'https://blueblaster.profit-insiders.com/';
        }

        // Logout
        window.handleLogout = function() {
            if (confirm('Are you sure you want to sign out?')) {
                sessionStorage.removeItem('imessage_crm_auth');
                window.location.href = 'https://blueblaster.profit-insiders.com/';
            }
        };

        const SUPABASE_URL = 'https://kbewkabvddddabqkozsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiZXdrYWJ2ZGRkZGFicWtvenN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTAzNTYsImV4cCI6MjA4Mjk4NjM1Nn0.pMIsBE9VNIiu0gf5f9ktyEXqGuieLYl_r-kyRs0POvg';

        const { useState, useEffect, useRef, useCallback } = React;
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const h = React.createElement;

        // ======== APP ========
        function App() {
          const [activeTab, setActiveTab] = useState('contacts');
          const [contacts, setContacts] = useState([]);
          const [lists, setLists] = useState([]);
          const [selectedList, setSelectedList] = useState('all');
          const [selectedContacts, setSelectedContacts] = useState([]);
          const [selectedContact, setSelectedContact] = useState(null);
          const [messageTemplate, setMessageTemplate] = useState('');
          const [batches, setBatches] = useState([]);
          const [campaigns, setCampaigns] = useState([]);
          const [templates, setTemplates] = useState([]);
          const [showCampaignModal, setShowCampaignModal] = useState(false);
          const [showTemplateModal, setShowTemplateModal] = useState(false);
          const [editingCampaign, setEditingCampaign] = useState(null);
          const [editingTemplate, setEditingTemplate] = useState(null);
          const [platform, setPlatform] = useState('imessage');
          const [sending, setSending] = useState(false);
          const [showContactModal, setShowContactModal] = useState(false);
          const [showListModal, setShowListModal] = useState(false);
          const [editingContact, setEditingContact] = useState(null);
          const [searchQuery, setSearchQuery] = useState('');
          const [stats, setStats] = useState({ totalBatches: 0, completed: 0, sending: 0, failed: 0, cancelled: 0 });
          const [error, setError] = useState(null);
          const [deliveryFilter, setDeliveryFilter] = useState('all');
          const [csvCountryCode, setCsvCountryCode] = useState('+1');

          useEffect(() => {
            try {
              fetchContacts();
              fetchLists();
              fetchBatches();
              fetchStats();
              fetchTemplates();
              fetchCampaigns();
            } catch (err) {
              setError(err.message);
              console.error('Init error:', err);
            }
          }, []);

          if (error) {
            return h('div', { style: { padding: '40px', textAlign: 'center' }},
              h('h2', { style: { color: '#ff3b30', marginBottom: '16px' }}, 'Error'),
              h('p', { style: { color: '#666' }}, error),
              h('button', {
                onClick: () => { setError(null); window.location.reload(); },
                style: { marginTop: '20px', padding: '12px 24px', background: 'linear-gradient(135deg, #007AFF 0%, #0051D5 100%)', color: '#fff', border: 'none', borderRadius: '12px', cursor: 'pointer', fontSize: '15px', fontWeight: '600' }
              }, 'Reload')
            );
          }

          const fetchContacts = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('contacts').select('*').order('created_at', { ascending: false });
              if (!error && data) setContacts(data);
            } catch (err) { console.error('Error:', err); }
          };

          const fetchLists = async () => {
            const allContacts = contacts.length;
            const tags = [...new Set(contacts.flatMap(c => c.metadata?.tags || []))];
            setLists([
              { id: 'all', name: 'All Contacts', count: allContacts },
              ...tags.map(tag => ({
                id: tag,
                name: tag,
                count: contacts.filter(c => c.metadata?.tags?.includes(tag)).length
              }))
            ]);
          };

          useEffect(() => { fetchLists(); }, [contacts]);

          const fetchBatches = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('message_batches').select('*').order('created_at', { ascending: false });
              if (!error && data) setBatches(data);
            } catch (err) { console.error('Error:', err); }
          };

          const fetchTemplates = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('templates').select('*').order('created_at', { ascending: false });
              if (!error && data) setTemplates(data);
            } catch (err) { console.error('Error fetching templates:', err); }
          };

          const fetchCampaigns = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('campaigns').select('*').order('created_at', { ascending: false });
              if (!error && data) setCampaigns(data);
            } catch (err) { console.error('Error fetching campaigns:', err); }
          };

          const fetchStats = async () => {
            try {
              const { data, error } = await supabaseClient.from('message_batches').select('status');
              if (!error && data) {
                setStats({
                  totalBatches: data.length,
                  completed: data.filter(b => b.status === 'completed').length,
                  sending: data.filter(b => b.status === 'sending').length,
                  failed: data.filter(b => b.status === 'failed').length,
                  cancelled: data.filter(b => b.status === 'cancelled').length
                });
              }
            } catch (err) { console.error('Error:', err); }
          };

          // ======== PHONE NUMBER HELPERS ========
          const normalizePhoneNumber = (phone, defaultCountryCode = '+1') => {
            let cleaned = phone.replace(/[^\d+]/g, '');
            if (cleaned.indexOf('+') > 0) {
              cleaned = cleaned.replace(/\+/g, '');
              cleaned = '+' + cleaned;
            }
            if (cleaned.startsWith('+')) {
              const digits = cleaned.substring(1);
              if (digits.length >= 8) return '+' + digits;
              return cleaned;
            }
            const digits = cleaned.replace(/\D/g, '');
            if (digits.length === 10) {
              const cc = defaultCountryCode.replace('+', '');
              if (cc === '1') return '+1' + digits;
              return '+' + cc + digits;
            } else if (digits.length === 11 && digits.startsWith('1')) {
              return '+' + digits;
            }
            else if (digits.startsWith('0') && defaultCountryCode === '+44') {
              return '+44' + digits.substring(1);
            }
            else if (digits.length >= 7 && digits.length <= 10 && !digits.startsWith('0')) {
              const cc = defaultCountryCode.replace('+', '');
              return '+' + cc + digits;
            }
            else if (digits.length >= 11) {
              return '+' + digits;
            }
            return '+' + digits;
          };

          const formatPhoneForDisplay = (phone) => {
            if (!phone) return '';
            if (phone.includes(' ')) return phone;
            const digits = phone.replace('+', '');
            if (digits.length === 11 && digits.startsWith('1')) {
              return '+1 (' + digits.substring(1, 4) + ') ' + digits.substring(4, 7) + '-' + digits.substring(7);
            }
            else if (digits.length === 10) {
              return '+1 (' + digits.substring(0, 3) + ') ' + digits.substring(3, 6) + '-' + digits.substring(6);
            }
            else {
              return '+' + digits;
            }
          };

          const formatPhoneForSending = (phone) => {
            if (!phone) return '';
            const cleaned = phone.replace(/\s/g, '');
            const digits = cleaned.replace(/[^\d]/g, '');
            if (digits.length === 11 && digits.startsWith('1')) {
              return '+1 ' + digits.substring(1, 4) + ' ' + digits.substring(4, 7) + ' ' + digits.substring(7);
            }
            else if (digits.length === 10) {
              return '+1 ' + digits.substring(0, 3) + ' ' + digits.substring(3, 6) + ' ' + digits.substring(6);
            }
            else if (digits.startsWith('44') && digits.length >= 12) {
              return '+44 ' + digits.substring(2, 6) + ' ' + digits.substring(6, 9) + ' ' + digits.substring(9);
            }
            else if (digits.startsWith('61') && digits.length >= 11) {
              return '+61 ' + digits.substring(2, 5) + ' ' + digits.substring(5, 8) + ' ' + digits.substring(8);
            }
            else if (digits.startsWith('971') && digits.length >= 12) {
              return '+971 ' + digits.substring(3, 5) + ' ' + digits.substring(5, 8) + ' ' + digits.substring(8);
            }
            else if (digits.startsWith('52') && digits.length >= 12) {
              return '+52 ' + digits.substring(2, 5) + ' ' + digits.substring(5, 8) + ' ' + digits.substring(8);
            }
            else if (digits.startsWith('91') && digits.length >= 12) {
              return '+91 ' + digits.substring(2, 7) + ' ' + digits.substring(7);
            }
            else if (digits.startsWith('86') && digits.length >= 11) {
              return '+86 ' + digits.substring(2, 5) + ' ' + digits.substring(5, 9) + ' ' + digits.substring(9);
            }
            else if (digits.startsWith('81') && digits.length >= 11) {
              return '+81 ' + digits.substring(2, 4) + ' ' + digits.substring(4, 8) + ' ' + digits.substring(8);
            }
            else if (digits.startsWith('33') && digits.length >= 11) {
              return '+33 ' + digits.substring(2, 3) + ' ' + digits.substring(3, 5) + ' ' + digits.substring(5, 7) + ' ' + digits.substring(7, 9) + ' ' + digits.substring(9);
            }
            else if (digits.startsWith('49') && digits.length >= 11) {
              return '+49 ' + digits.substring(2, 5) + ' ' + digits.substring(5);
            }
            else if (digits.startsWith('34') && digits.length >= 11) {
              return '+34 ' + digits.substring(2, 5) + ' ' + digits.substring(5, 7) + ' ' + digits.substring(7, 9) + ' ' + digits.substring(9);
            }
            else if (digits.startsWith('39') && digits.length >= 12) {
              return '+39 ' + digits.substring(2, 5) + ' ' + digits.substring(5, 8) + ' ' + digits.substring(8);
            }
            else if (digits.startsWith('55') && digits.length >= 12) {
              return '+55 ' + digits.substring(2, 4) + ' ' + digits.substring(4, 9) + ' ' + digits.substring(9);
            }
            else if (digits.length > 10) {
              let countryCode = digits.substring(0, 2);
              let rest = digits.substring(2);
              let formatted = '+' + countryCode;
              for (let i = 0; i < rest.length; i += 3) {
                formatted += ' ' + rest.substring(i, i + 3);
              }
              return formatted.trim();
            }
            return '+' + digits;
          };

          const formatNumberForCopy = (phone) => {
            if (!phone) return '';
            const cleaned = phone.replace(/\s/g, '');
            const digits = cleaned.replace(/[^\d]/g, '');
            if (digits.length === 11 && digits.startsWith('1')) {
              return '+1 ' + digits.substring(1, 4) + ' ' + digits.substring(4, 7) + ' ' + digits.substring(7);
            } else if (digits.length === 10) {
              return '+1 ' + digits.substring(0, 3) + ' ' + digits.substring(3, 6) + ' ' + digits.substring(6);
            }
            else if (digits.startsWith('44') && digits.length >= 12) {
              return '+44 ' + digits.substring(2, 6) + ' ' + digits.substring(6, 9) + ' ' + digits.substring(9);
            }
            else if (digits.startsWith('971') && digits.length >= 12) {
              return '+971 ' + digits.substring(3, 5) + ' ' + digits.substring(5, 8) + ' ' + digits.substring(8);
            }
            else if (digits.length > 10) {
              let countryCode = digits.substring(0, 2);
              let rest = digits.substring(2);
              let formatted = '+' + countryCode;
              for (let i = 0; i < rest.length; i += 3) {
                formatted += ' ' + rest.substring(i, i + 3);
              }
              return formatted.trim();
            }
            return '+' + digits;
          };

          // ======== CSV IMPORT ========
          const handleCSVUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
              const text = await file.text();
              const lines = text.split('\n');

              let headerRowIndex = 0;
              const phoneKeywords = ['phone', 'mobile', 'cell', 'number', 'tel', 'country'];
              for (let i = 0; i < Math.min(lines.length, 10); i++) {
                const lowLine = lines[i].toLowerCase();
                if (phoneKeywords.some(kw => lowLine.includes(kw))) {
                  headerRowIndex = i;
                  break;
                }
              }

              const rawHeaders = lines[headerRowIndex].split(',').map(h => h.trim().replace(/['"]/g, ''));
              const headers = rawHeaders.map(h => h.toLowerCase().replace(/[\s-]/g, '_').replace(/#/g, ''));
              const newContacts = [];

              console.log('CSV Header row index:', headerRowIndex);
              console.log('CSV Headers:', rawHeaders, ' -> normalized:', headers);

              for (let i = headerRowIndex + 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim().replace(/['"]/g, ''));
                const contact = {};
                headers.forEach((header, index) => { contact[header] = values[index]; });

                console.log('Row', i, ':', contact);

                const phoneVal = contact.phone || contact.phone_number || contact.phonenumber ||
                  contact.mobile || contact.cell || contact.number || contact.tel || contact.telephone || '';

                const ccVal = contact.country_code || contact.countrycode || contact.cc ||
                  contact.country || contact.code || contact.dial_code || contact.dialcode || '';

                const firstName = contact.first_name || contact.firstname || contact.first || contact.name || '';
                const lastName = contact.last_name || contact.lastname || contact.last || contact.surname || '';

                let rawPhone = '';
                if (ccVal && phoneVal) {
                  const cc = ccVal.toString().trim().replace(/[^\d+]/g, '');
                  const num = phoneVal.toString().trim().replace(/[^\d]/g, '');
                  rawPhone = (cc.startsWith('+') ? cc : '+' + cc) + num;
                } else if (phoneVal) {
                  rawPhone = phoneVal.toString().trim();
                }

                if (!rawPhone && values.length >= 2) {
                  const col0 = (values[0] || '').trim();
                  const col1 = (values[1] || '').trim();
                  const col0Digits = col0.replace(/[^\d]/g, '');
                  const col1Digits = col1.replace(/[^\d]/g, '');
                  if (col0Digits.length <= 4 && col1Digits.length >= 7) {
                    const cc = col0.replace(/[^\d+]/g, '');
                    rawPhone = (cc.startsWith('+') ? cc : '+' + cc) + col1Digits;
                  } else if (col0Digits.length >= 7) {
                    rawPhone = col0;
                  }
                }

                if (rawPhone) {
                  newContacts.push({
                    phone: normalizePhoneNumber(rawPhone, csvCountryCode),
                    first_name: firstName,
                    last_name: lastName,
                    metadata: contact
                  });
                }
              }

              console.log('Parsed contacts:', newContacts.length, newContacts.slice(0, 3));

              const { error } = await supabaseClient.from('contacts').insert(newContacts);
              if (!error) {
                fetchContacts();
                alert('Successfully imported ' + newContacts.length + ' contacts');
              } else {
                alert('Error importing contacts: ' + error.message);
              }
            } catch (err) {
              alert('Error reading file: ' + err.message);
            }
          };

          // ======== SEND BLAST ========
          const handleSendBlast = async (customMessage = null, customContacts = null) => {
            console.log('handleSendBlast called with:', { customMessage, customContacts });

            const message = customMessage || messageTemplate;
            const blastContacts = customContacts || selectedContacts;

            console.log('After defaults:', { message, contacts: blastContacts });

            if (!message || blastContacts.length === 0) {
              alert('Please enter a message and select contacts');
              return;
            }

            setSending(true);
            try {
              const { data: batch, error: batchError } = await supabaseClient
                .from('message_batches')
                .insert({
                  platform: platform,
                  message_template: message,
                  total_messages: blastContacts.length,
                  status: 'pending'
                }).select().single();

              if (batchError) throw batchError;

              const messages = blastContacts.map(contact => ({
                batch_id: batch.id,
                contact_id: contact.id && contact.id.startsWith('temp_') ? null : contact.id,
                phone_number: 'PLUS' + normalizePhoneNumber(contact.phone).replace('+', ''),
                message: personalizeMessage(message, contact),
                status: 'queued'
              }));

              const { error: messagesError } = await supabaseClient.from('messages').insert(messages);
              if (messagesError) throw messagesError;

              await supabaseClient.from('message_batches').update({ status: 'sending' }).eq('id', batch.id);

              const shortcutUrl = `shortcuts://run-shortcut?name=iMessage%20Blaster&input=${encodeURIComponent(JSON.stringify({
                batchId: batch.id,
                supabaseUrl: SUPABASE_URL,
                supabaseKey: SUPABASE_ANON_KEY,
                timeout: 15,
                skipOnFailure: true,
                retryCount: 1
              }))}`;

              window.location.href = shortcutUrl;
              fetchBatches();
              fetchStats();
              setActiveTab('activity');

              setTimeout(() => {
                alert('Batch created! Opening Shortcuts app...');
              }, 500);
            } catch (err) {
              alert('Error: ' + err.message);
            } finally {
              setSending(false);
            }
          };

          window.handleSendBlast = handleSendBlast;

          const personalizeMessage = (template, contact) => {
            let message = template;
            message = message.replace(/\{\{first_name\}\}/g, contact.first_name || '');
            message = message.replace(/\{\{last_name\}\}/g, contact.last_name || '');
            message = message.replace(/\{\{phone\}\}/g, contact.phone || '');
            if (contact.metadata) {
              Object.keys(contact.metadata).forEach(key => {
                message = message.replace(new RegExp(`\\{\\{${key}\\}\\}`, 'g'), contact.metadata[key] || '');
              });
            }
            return message;
          };

          const toggleContact = (contact) => {
            setSelectedContacts(prev => {
              const exists = prev.find(c => c.id === contact.id);
              return exists ? prev.filter(c => c.id !== contact.id) : [...prev, contact];
            });
          };

          const selectAll = () => {
            const filtered = getFilteredContacts();
            setSelectedContacts(prev => prev.length === filtered.length ? [] : [...filtered]);
          };

          const getFilteredContacts = () => {
            let filtered = contacts;
            if (selectedList !== 'all') {
              filtered = filtered.filter(c => c.metadata?.tags?.includes(selectedList));
            }
            if (deliveryFilter === 'undeliverable') {
              filtered = filtered.filter(c => c.metadata?.delivery_status === 'undeliverable');
            } else if (deliveryFilter === 'deliverable') {
              filtered = filtered.filter(c => c.metadata?.delivery_status !== 'undeliverable');
            }
            if (searchQuery) {
              filtered = filtered.filter(c =>
                c.first_name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                c.last_name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                c.phone?.includes(searchQuery)
              );
            }
            return filtered;
          };

          // ======== CONTACT CRUD ========
          const saveContact = async (contactData) => {
            try {
              const normalizedData = {
                ...contactData,
                phone: normalizePhoneNumber(contactData.phone)
              };
              if (editingContact) {
                const { error } = await supabaseClient
                  .from('contacts')
                  .update(normalizedData)
                  .eq('id', editingContact.id);
                if (error) throw error;
              } else {
                const { error } = await supabaseClient
                  .from('contacts')
                  .insert([normalizedData]);
                if (error) throw error;
              }
              fetchContacts();
              setShowContactModal(false);
              setEditingContact(null);
              alert(editingContact ? 'Contact updated' : 'Contact created');
            } catch (err) {
              alert('Error saving contact: ' + err.message);
            }

            try {

                .eq('id', contactId);
              if (error) throw error;

              return;
            }
            try {
              const { data: allContacts, error: fetchError } = await supabaseClient
                .from('contacts')
                .select('*');
              if (fetchError) throw fetchError;
              let updated = 0;
              for (const contact of allContacts) {
                const normalizedPhone = normalizePhoneNumber(contact.phone);
                if (normalizedPhone !== contact.phone) {
                  const { error: updateError } = await supabaseClient
                    .from('contacts')
                    .update({ phone: normalizedPhone })
                    .eq('id', contact.id);
                  if (!updateError) updated++;
                }
              }
              alert('Updated ' + updated + ' phone numbers with proper iMessage formatting');
              fetchContacts();
            } catch (err) {
              alert('Error updating phone numbers: ' + err.message);
              console.error('Error:', err);

            const newMetadata = {
              ...contact.metadata,
              tags: [...currentTags, tag]

            try {
              const { error } = await supabaseClient
                .from('contacts')
                .update({ metadata: newMetadata })

              if (error) throw error;

            const newMetadata = {
              ...contact.metadata,
              tags: currentTags.filter(t => t !== tag)

            try {

        // ======== CONTACT MODAL ========
        function ContactModal(props) {
          const { contact, show, onClose, onSave, blueBtn, secondaryBtn, inputStyle, labelStyle } = props;
          const [formData, setFormData] = React.useState({
            first_name: contact?.first_name || '',
            last_name: contact?.last_name || '',
            phone: contact?.phone || '',
            metadata: contact?.metadata || {}
          });
          const [tagInput, setTagInput] = React.useState('');
          const [tags, setTags] = React.useState(contact?.metadata?.tags || []);

          React.useEffect(() => {
            if (contact) {
              setFormData({
                first_name: contact.first_name || '',
                last_name: contact.last_name || '',
                phone: contact.phone || '',
                metadata: contact.metadata || {}
              });
              setTags(contact.metadata?.tags || []);
            } else {
              setFormData({ first_name: '', last_name: '', phone: '', metadata: {} });
              setTags([]);
            }
            setTagInput('');
          }, [contact, show]);

          const handleSubmit = (e) => {
            e.preventDefault();
            const dataToSave = {
              ...formData,
              metadata: { ...formData.metadata, tags: tags }
            };
            onSave(dataToSave);
          };

          const addTag = () => {
            if (tagInput.trim() && !tags.includes(tagInput.trim())) {
              setTags([...tags, tagInput.trim()]);
              setTagInput('');
            }
          };

          const removeTag = (tagToRemove) => {
            setTags(tags.filter(tag => tag !== tagToRemove));
          };

          if (!show) return null;

          return h('div', { className: 'modal-overlay', onClick: onClose },
            h('div', { className: 'modal-content', onClick: (e) => e.stopPropagation(), style: { padding: '28px' }},
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }},
                h('h2', { style: { fontSize: '20px', fontWeight: '600', color: '#333' }}, contact ? 'Edit Contact' : 'New Contact'),
                h('button', { onClick: onClose, style: { background: 'none', border: 'none', fontSize: '22px', cursor: 'pointer', color: '#999' }}, '\u00D7')
              ),
              h('form', { onSubmit: handleSubmit },
                h('div', { style: { marginBottom: '16px' }},
                  h('label', { style: labelStyle }, 'First Name'),
                  h('input', {
                    type: 'text',
                    value: formData.first_name,
                    onChange: (e) => setFormData({ ...formData, first_name: e.target.value }),
                    style: inputStyle,
                    required: true
                  })
                ),
                h('div', { style: { marginBottom: '16px' }},
                  h('label', { style: labelStyle }, 'Last Name'),
                  h('input', {
                    type: 'text',
                    value: formData.last_name,
                    onChange: (e) => setFormData({ ...formData, last_name: e.target.value }),
                    style: inputStyle,
                    required: true
                  })
                ),
                h('div', { style: { marginBottom: '16px' }},
                  h('label', { style: labelStyle }, 'Phone Number'),
                  h('input', {
                    type: 'tel',
                    value: formData.phone,
                    onChange: (e) => setFormData({ ...formData, phone: e.target.value }),
                    placeholder: '+1234567890',
                    style: inputStyle,
                    required: true
                  })
                ),
                h('div', { style: { marginBottom: '16px' }},
                  h('label', { style: labelStyle }, 'Tags'),
                  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '8px', minHeight: '32px', padding: '8px', background: 'rgba(0, 0, 0, 0.02)', borderRadius: '10px' }},
                    tags.length === 0 ? h('span', { style: { color: '#aaa', fontSize: '13px' }}, 'No tags yet') :
                    tags.map(tag => h('span', {
                      key: tag,
                      style: { display: 'inline-flex', alignItems: 'center', gap: '4px', fontSize: '12px', padding: '4px 10px', borderRadius: '6px', background: 'rgba(0, 122, 255, 0.1)', color: '#007AFF' }
                    },
                      tag,
                      h('span', { onClick: () => removeTag(tag), style: { cursor: 'pointer', fontWeight: 'bold' }}, '\u00D7')
                    ))
                  ),
                  h('div', { style: { display: 'flex', gap: '8px' }},
                    h('input', {
                      type: 'text',
                      value: tagInput,
                      onChange: (e) => setTagInput(e.target.value),
                      placeholder: 'Add a tag',
                      style: { ...inputStyle, flex: 1 },
                      onKeyPress: (e) => {
                        if (e.key === 'Enter') { e.preventDefault(); addTag(); }
                      }
                    }),
                    h('button', {
                      type: 'button',
                      onClick: addTag,
                      style: { ...blueBtn, padding: '10px 16px' }
                    }, '+ Add')
                  ),
                  h('p', { style: { marginTop: '6px', fontSize: '12px', color: '#aaa' }}, 'Tags help organize contacts into lists')
                ),
                h('div', { style: { display: 'flex', gap: '10px', marginTop: '24px' }},
                  h('button', {
                    type: 'button',
                    onClick: onClose,
                    style: { ...secondaryBtn, flex: 1 }
                  }, 'Cancel'),
                  h('button', {
                    type: 'submit',
                    style: { ...blueBtn, flex: 1 }
                  }, 'Save Contact')
                )
              )
            )
          );
        }

        // ======== QUICK SEND VIEW ========
        function QuickSendView(props) {
          const { normalizePhoneNumber, templates, platform, setPlatform, sending, blueBtn, secondaryBtn, inputStyle, labelStyle } = props;
          const [phoneList, setPhoneList] = React.useState('');
          const [manualMessage, setManualMessage] = React.useState('');
          const [parsedNumbers, setParsedNumbers] = React.useState([]);
          const [selectedTemplate, setSelectedTemplate] = React.useState('');

          React.useEffect(() => {
            if (!phoneList.trim()) { setParsedNumbers([]); return; }
            const numbers = phoneList
              .split(/[\n,;\s]+/)
              .map(num => num.trim())
              .filter(num => num.length > 0)
              .map(num => normalizePhoneNumber(num));
            setParsedNumbers([...new Set(numbers)]);
          }, [phoneList]);

          const handleTemplateSelect = (templateId) => {
            setSelectedTemplate(templateId);
            if (templateId) {
              const tmpl = templates.find(t => t.id === templateId);
              if (tmpl) setManualMessage(tmpl.message);
            }
          };

          const handleManualSend = async () => {
            if (!manualMessage || parsedNumbers.length === 0) {
              alert('Please enter a message and at least one phone number');
              return;
            }
            const tempContacts = parsedNumbers.map((phone, index) => ({
              id: 'temp_' + Date.now() + '_' + index,
              phone: phone,
              first_name: '',
              last_name: '',
              metadata: {}
            }));
            await window.handleSendBlast(manualMessage, tempContacts);
          };

          return h('div', { className: 'glass-card', style: { padding: '28px', animation: 'fadeIn 0.3s ease-out' }},
            h('h2', { style: { fontSize: '20px', fontWeight: '600', color: '#333', marginBottom: '4px' }}, 'Quick Send'),
            h('p', { style: { fontSize: '14px', color: '#888', marginBottom: '24px' }}, 'Paste phone numbers directly to send a blast'),

            h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }},
              // Left: Numbers
              h('div', null,
                h('label', { style: labelStyle }, 'Phone Numbers'),
                h('textarea', {
                  value: phoneList,
                  onChange: (e) => setPhoneList(e.target.value),
                  placeholder: 'Paste phone numbers here...\n\n5551234567\n+1-555-234-5678\n(555) 345-6789',
                  rows: 12,
                  style: { ...inputStyle, resize: 'vertical', fontFamily: 'monospace', fontSize: '13px', lineHeight: '1.6' }
                }),
                h('p', { style: { marginTop: '8px', fontSize: '13px', color: '#888' }},
                  parsedNumbers.length > 0
                    ? parsedNumbers.length + ' number' + (parsedNumbers.length === 1 ? '' : 's') + ' detected'
                    : 'Separate with commas, spaces, or new lines'
                ),
                parsedNumbers.length > 0 && h('div', { style: { marginTop: '10px', padding: '10px', background: 'rgba(0, 0, 0, 0.03)', borderRadius: '10px', maxHeight: '120px', overflowY: 'auto' }},
                  h('div', { style: { fontSize: '12px', color: '#888', marginBottom: '6px', fontWeight: '600' }}, 'Formatted:'),
                  parsedNumbers.map((num, i) => h('div', { key: i, style: { fontSize: '12px', fontFamily: 'monospace', color: '#333' }}, num))
                )
              ),

              // Right: Message
              h('div', null,
                templates.length > 0 && h('div', { style: { marginBottom: '12px' }},
                  h('label', { style: labelStyle }, 'Template'),
                  h('select', {
                    value: selectedTemplate,
                    onChange: (e) => handleTemplateSelect(e.target.value),
                    style: inputStyle
                  },
                    h('option', { value: '' }, 'Choose a template...'),
                    templates.map(t => h('option', { key: t.id, value: t.id }, t.name))
                  )
                ),

                h('label', { style: labelStyle }, 'Message'),
                h('textarea', {
                  value: manualMessage,
                  onChange: (e) => setManualMessage(e.target.value),
                  placeholder: 'Type your message here...',
                  rows: 12,
                  style: { ...inputStyle, resize: 'vertical', lineHeight: '1.5' }
                }),

                h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px' }},
                  h('span', { style: { fontSize: '12px', color: '#888' }}, manualMessage.length + ' chars'),
                  h('select', {
                    value: platform,
                    onChange: (e) => setPlatform(e.target.value),
                    style: { ...inputStyle, width: '120px', padding: '6px 10px', fontSize: '13px' }
                  },
                    h('option', { value: 'imessage' }, 'iMessage'),
                    h('option', { value: 'sms' }, 'SMS')
                  )
                ),

                h('button', {
                  onClick: handleManualSend,
                  disabled: sending || !manualMessage || parsedNumbers.length === 0,
                  style: { ...blueBtn, width: '100%', marginTop: '16px', padding: '14px', fontSize: '15px', opacity: (sending || !manualMessage || parsedNumbers.length === 0) ? 0.5 : 1 }
                }, sending ? 'Sending...' : 'Send to ' + parsedNumbers.length + ' number' + (parsedNumbers.length === 1 ? '' : 's'))
              )
            )
          );
        }

        // ======== CAMPAIGNS VIEW ========
        function CampaignsView(props) {
          const { campaigns, setCampaigns, contacts, templates, showCampaignModal, setShowCampaignModal, blueBtn, secondaryBtn, inputStyle, labelStyle } = props;
          const [showNewCampaign, setShowNewCampaign] = React.useState(false);
          const [campaignForm, setCampaignForm] = React.useState({
            name: '',
            message: '',
            segment: 'all',
            schedule: 'now',
            scheduleDate: '',
            scheduleTime: '',
            frequency: 'once',
            status: 'draft'
          });

          React.useEffect(() => {
            if (showCampaignModal) setShowNewCampaign(true);
          }, [showCampaignModal]);

          React.useEffect(() => {
            if (!showNewCampaign) setShowCampaignModal(false);
          }, [showNewCampaign]);

          const handleCreateCampaign = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('campaigns')
                .insert([{
                  name: campaignForm.name,
                  message: campaignForm.message,
                  segment: campaignForm.segment,
                  schedule: campaignForm.schedule,
                  schedule_date: campaignForm.scheduleDate || null,
                  schedule_time: campaignForm.scheduleTime || null,
                  frequency: campaignForm.frequency,
                  status: 'draft',
                  sent_count: 0,
                  total_recipients: contacts.length
                }])
                .select();

              if (error) throw error;

              if (data) {
                setCampaigns([...campaigns, data[0]]);
                setShowNewCampaign(false);
                setCampaignForm({ name: '', message: '', segment: 'all', schedule: 'now', scheduleDate: '', scheduleTime: '', frequency: 'once', status: 'draft' });
                alert('Campaign created');
              }
            } catch (err) {
              alert('Error creating campaign: ' + err.message);
              console.error('Error:', err);
            }
          };

          const handleLaunchCampaign = (campaign) => {
            alert('Launching campaign: ' + campaign.name);
          };

          return h('div', { style: { animation: 'fadeIn 0.3s ease-out' }},
            // New campaign button
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }},

                onClick: () => setShowNewCampaign(!showNewCampaign),

              h('h3', { style: { fontSize: '18px', fontWeight: '600', color: '#333', marginBottom: '20px' }}, 'Create Campaign'),

                h('div', null,
                  h('label', { style: labelStyle }, 'Campaign Name'),
                  h('input', {
                    type: 'text',
                    value: campaignForm.name,
                    onChange: (e) => setCampaignForm({...campaignForm, name: e.target.value}),
                    placeholder: 'Summer Sale 2024',
                    style: inputStyle
                  })
                ),
                h('div', null,
                  h('label', { style: labelStyle }, 'Target Segment'),
                  h('select', {
                    value: campaignForm.segment,
                    onChange: (e) => setCampaignForm({...campaignForm, segment: e.target.value}),
                    style: inputStyle
                  },
                    h('option', { value: 'all' }, 'All Contacts'),
                    h('option', { value: 'active' }, 'Active Customers'),
                    h('option', { value: 'inactive' }, 'Inactive (30+ days)')
                  )
                )
              ),
              h('div', { style: { marginBottom: '16px' }},
                h('label', { style: labelStyle }, 'Message'),
                h('textarea', {
                  value: campaignForm.message,
                  onChange: (e) => setCampaignForm({...campaignForm, message: e.target.value}),
                  placeholder: 'Your campaign message...',
                  rows: 4,
                  style: { ...inputStyle, resize: 'vertical' }
                })
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '20px' }},
                h('div', null,
                  h('label', { style: labelStyle }, 'Schedule'),
                  h('select', {
                    value: campaignForm.schedule,
                    onChange: (e) => setCampaignForm({...campaignForm, schedule: e.target.value}),
                    style: inputStyle
                  },
                    h('option', { value: 'now' }, 'Send Now'),
                    h('option', { value: 'scheduled' }, 'Schedule')
                  )
                ),
                campaignForm.schedule === 'scheduled' && h('div', null,
                  h('label', { style: labelStyle }, 'Date'),
                  h('input', { type: 'date', value: campaignForm.scheduleDate, onChange: (e) => setCampaignForm({...campaignForm, scheduleDate: e.target.value}), style: inputStyle })
                ),

                    h('p', { style: { fontSize: '16px', marginBottom: '8px' }}, 'No campaigns yet'),
                    h('p', { style: { fontSize: '13px' }}, 'Create your first automated campaign')
                  )
                : h('table', { style: { width: '100%', borderCollapse: 'collapse' }},
                    h('thead', null,
                      h('tr', { style: { borderBottom: '1px solid rgba(0,0,0,0.06)' }},
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Name'),
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Status'),
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Recipients'),
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Schedule'),
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Created'),
                        h('th', { style: { textAlign: 'left', padding: '14px 16px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Actions')
                      )
                    ),
                    h('tbody', null,
                      campaigns.map(campaign =>
                        h('tr', { key: campaign.id, style: { borderBottom: '1px solid rgba(0,0,0,0.04)' }},
                          h('td', { style: { padding: '12px 16px', fontSize: '14px', fontWeight: '500' }}, campaign.name),
                          h('td', { style: { padding: '12px 16px' }},
                            h('span', { style: { fontSize: '12px', padding: '3px 8px', borderRadius: '6px', background: campaign.status === 'active' ? 'rgba(40,167,69,0.1)' : 'rgba(0,0,0,0.04)', color: campaign.status === 'active' ? '#28a745' : '#888', fontWeight: '600' }}, campaign.status || 'draft')
                          ),
                          h('td', { style: { padding: '12px 16px', fontSize: '14px' }}, campaign.total_recipients),
                          h('td', { style: { padding: '12px 16px', fontSize: '14px' }}, campaign.schedule === 'now' ? 'Immediate' : (campaign.schedule_date || '--')),
                          h('td', { style: { padding: '12px 16px', fontSize: '14px', color: '#888' }}, new Date(campaign.created_at).toLocaleDateString()),
                          h('td', { style: { padding: '12px 16px' }},
                            h('button', {
                              onClick: () => handleLaunchCampaign(campaign),
                              style: { ...blueBtn, padding: '6px 14px', fontSize: '12px' }
                            }, 'Launch')
                          )
                        )
                      )
                    )
                  )
            )
          );
        }

        // ======== TEMPLATES VIEW ========
        function TemplatesView(props) {
          const { templates, setTemplates, blueBtn, secondaryBtn, inputStyle, labelStyle } = props;
          const [showNewTemplate, setShowNewTemplate] = React.useState(false);
          const [templateForm, setTemplateForm] = React.useState({ name: '', message: '', category: 'general' });

          const handleSaveTemplate = async () => {
            try {
              const { data, error } = await supabaseClient
                .from('templates')
                .insert([{
                  name: templateForm.name,
                  message: templateForm.message,
                  category: templateForm.category,
                  used_count: 0
                }])
                .select();

              if (error) throw error;

              if (data) {
                setTemplates([...templates, data[0]]);
                setShowNewTemplate(false);
                setTemplateForm({ name: '', message: '', category: 'general' });
                alert('Template saved');
              }
            } catch (err) {
              alert('Error saving template: ' + err.message);
              console.error('Error:', err);
            }
          };

          const handleUseTemplate = (template) => {
            navigator.clipboard.writeText(template.message);
            alert('Template copied to clipboard');
          };

          return h('div', { style: { animation: 'fadeIn 0.3s ease-out' }},
            // Header
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }},
              h('p', { style: { fontSize: '14px', color: '#888' }}, 'Save and reuse your best messages'),
              h('button', {
                onClick: () => setShowNewTemplate(!showNewTemplate),
                style: blueBtn
              }, showNewTemplate ? 'Cancel' : '+ New Template')
            ),

            // New template form
            showNewTemplate && h('div', { className: 'glass-card', style: { padding: '24px', marginBottom: '20px' }},
              h('h3', { style: { fontSize: '18px', fontWeight: '600', color: '#333', marginBottom: '20px' }}, 'Create Template'),
              h('div', { style: { display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '16px', marginBottom: '16px' }},
                h('div', null,
                  h('label', { style: labelStyle }, 'Template Name'),
                  h('input', {
                    type: 'text',
                    value: templateForm.name,
                    onChange: (e) => setTemplateForm({...templateForm, name: e.target.value}),
                    placeholder: 'Welcome Message',
                    style: inputStyle
                  })
                ),
                h('div', null,
                  h('label', { style: labelStyle }, 'Category'),
                  h('select', {
                    value: templateForm.category,
                    onChange: (e) => setTemplateForm({...templateForm, category: e.target.value}),
                    style: inputStyle
                  },
                    h('option', { value: 'general' }, 'General'),
                    h('option', { value: 'welcome' }, 'Welcome'),
                    h('option', { value: 'followup' }, 'Follow-up'),
                    h('option', { value: 'promotion' }, 'Promotion')
                  )
                )
              ),
              h('div', { style: { marginBottom: '16px' }},
                h('label', { style: labelStyle }, 'Message'),
                h('textarea', {
                  value: templateForm.message,
                  onChange: (e) => setTemplateForm({...templateForm, message: e.target.value}),
                  placeholder: 'Hi {{first_name}}, welcome to...',
                  rows: 5,
                  style: { ...inputStyle, resize: 'vertical' }
                }),
                h('p', { style: { marginTop: '6px', fontSize: '12px', color: '#aaa' }}, 'Use {{variable}} for personalization')
              ),
              h('button', {
                onClick: handleSaveTemplate,
                disabled: !templateForm.name || !templateForm.message,
                style: { ...blueBtn, width: '100%', padding: '14px', opacity: (!templateForm.name || !templateForm.message) ? 0.5 : 1 }
              }, 'Save Template')
            ),

            // Template cards
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '16px' }},
              templates.length === 0
                ? h('div', { className: 'glass-card', style: { gridColumn: '1 / -1', textAlign: 'center', padding: '48px', color: '#888' }},
                    h('p', { style: { fontSize: '16px', marginBottom: '8px' }}, 'No templates yet'),
                    h('p', { style: { fontSize: '13px' }}, 'Create templates to speed up your workflow')
                  )
                : templates.map(template => h('div', {
                    key: template.id,
                    className: 'glass-card',
                    style: { padding: '20px' }
                  },
                    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '10px' }},
                      h('h3', { style: { fontSize: '16px', fontWeight: '600', color: '#333' }}, template.name),
                      h('span', { style: { fontSize: '11px', padding: '3px 8px', borderRadius: '6px', background: 'rgba(0, 122, 255, 0.1)', color: '#007AFF', fontWeight: '600' }}, template.category)
                    ),
                    h('p', { style: { fontSize: '13px', color: '#666', lineHeight: '1.5', marginBottom: '16px' }}, template.message.substring(0, 120) + (template.message.length > 120 ? '...' : '')),
                    h('button', {
                      onClick: () => handleUseTemplate(template),
                      style: { ...secondaryBtn, width: '100%', fontSize: '13px' }
                    }, 'Copy Template')
                  ))
            )
          );
        }

        // ======== ACTIVITY / DELIVERY VIEW ========
        function DeliveryView(props) {
          const { batches, stats, blueBtn, secondaryBtn } = props;
          const [expandedBatch, setExpandedBatch] = React.useState(null);
          const [unsentNumbers, setUnsentNumbers] = React.useState(null);
          const [loading, setLoading] = React.useState(false);

          const showUnsentNumbers = async (batchId) => {
            setLoading(true);
            try {
              const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('phone_number, status, contact_id, message, created_at')
                .eq('batch_id', batchId)
                .order('created_at', { ascending: true });

              if (error) throw error;

              const queued = messages.filter(m => m.status === 'queued');
              const sendingMsgs = messages.filter(m => m.status === 'sending');
              const sent = messages.filter(m => m.status === 'sent');
              const failed = messages.filter(m => m.status === 'failed');
              const unsent = messages.filter(m => m.status === 'queued' || m.status === 'failed' || m.status === 'sending');

              setUnsentNumbers({
                batchId,
                unsent: unsent.map(m => m.phone_number),
                sent: sent.map(m => m.phone_number),
                queued: queued.map(m => m.phone_number),
                sending: sendingMsgs.map(m => m.phone_number),
                failed: failed.map(m => m.phone_number),
                total: messages.length
              });
              setExpandedBatch(batchId);
            } catch (err) {
              alert('Error fetching messages: ' + err.message);
            } finally {
              setLoading(false);
            }
          };

          const copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => {
              alert('Copied to clipboard. Paste into Quick Send tab.');
            }).catch(() => {
              alert('Please manually select and copy the numbers');
            });
          };

          return h('div', { style: { animation: 'fadeIn 0.3s ease-out' }},
            // Stat cards - 4 stat breakdown
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '24px' }},
              [
                { label: 'Sent', value: stats.completed, color: '#28a745', bg: 'rgba(40, 167, 69, 0.08)' },
                { label: 'Sending', value: stats.sending, color: '#007AFF', bg: 'rgba(0, 122, 255, 0.08)' },
                { label: 'Queued', value: stats.totalBatches - stats.completed - stats.sending - stats.failed - stats.cancelled, color: '#f0ad4e', bg: 'rgba(240, 173, 78, 0.08)' },
                { label: 'Failed', value: stats.failed, color: '#dc3545', bg: 'rgba(220, 53, 69, 0.08)' }
              ].map((stat, i) => h('div', {
                key: i,
                className: 'glass-card',
                style: { padding: '20px', textAlign: 'center', background: stat.bg }
              },
                h('div', { style: { fontSize: '28px', fontWeight: '700', color: stat.color, marginBottom: '4px' }}, stat.value),
                h('div', { style: { fontSize: '13px', color: '#888', fontWeight: '500' }}, stat.label)
              ))
            ),

            // Batch list
            h('div', { className: 'glass-card', style: { overflow: 'hidden' }},
              h('div', { style: { padding: '20px 20px 0' }},
                h('h3', { style: { fontSize: '18px', fontWeight: '600', color: '#333', marginBottom: '16px' }}, 'Message Batches')
              ),
              batches.length === 0
                ? h('div', { style: { textAlign: 'center', padding: '48px', color: '#888' }},
                    h('p', { style: { fontSize: '16px', marginBottom: '8px' }}, 'No activity yet'),
                    h('p', { style: { fontSize: '13px' }}, 'Your message batches will appear here')
                  )
                : h('table', { style: { width: '100%', borderCollapse: 'collapse' }},
                    h('thead', null,
                      h('tr', { style: { borderBottom: '1px solid rgba(0,0,0,0.06)' }},
                        h('th', { style: { textAlign: 'left', padding: '12px 20px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Date'),
                        h('th', { style: { textAlign: 'left', padding: '12px 20px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Messages'),
                        h('th', { style: { textAlign: 'left', padding: '12px 20px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Platform'),
                        h('th', { style: { textAlign: 'left', padding: '12px 20px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Status'),
                        h('th', { style: { textAlign: 'left', padding: '12px 20px', fontSize: '12px', fontWeight: '600', color: '#888', textTransform: 'uppercase', letterSpacing: '0.05em' }}, 'Actions')
                      )
                    ),
                    h('tbody', null,
                      batches.map(batch => h(React.Fragment, { key: batch.id },
                        h('tr', { style: { borderBottom: '1px solid rgba(0,0,0,0.04)' }},
                          h('td', { style: { padding: '12px 20px', fontSize: '14px' }}, new Date(batch.created_at).toLocaleString()),
                          h('td', { style: { padding: '12px 20px', fontSize: '14px' }}, batch.total_messages),
                          h('td', { style: { padding: '12px 20px', fontSize: '14px' }}, batch.platform === 'imessage' ? 'iMessage' : 'SMS'),
                          h('td', { style: { padding: '12px 20px' }},
                            h('span', { style: { fontSize: '12px', padding: '3px 8px', borderRadius: '6px', fontWeight: '600', background: batch.status === 'completed' ? 'rgba(40,167,69,0.1)' : batch.status === 'sending' ? 'rgba(0,122,255,0.1)' : batch.status === 'failed' ? 'rgba(220,53,69,0.1)' : 'rgba(0,0,0,0.04)', color: batch.status === 'completed' ? '#28a745' : batch.status === 'sending' ? '#007AFF' : batch.status === 'failed' ? '#dc3545' : '#888' }}, batch.status.charAt(0).toUpperCase() + batch.status.slice(1))
                          ),
                          h('td', { style: { padding: '12px 20px' }},
                            h('button', {
                              onClick: () => expandedBatch === batch.id ? setExpandedBatch(null) : showUnsentNumbers(batch.id),
                              disabled: loading,
                              style: { ...secondaryBtn, padding: '6px 14px', fontSize: '12px' }
                            }, expandedBatch === batch.id ? 'Close' : 'View Numbers')
                          )
                        ),

                        // Expanded details
                        expandedBatch === batch.id && unsentNumbers && h('tr', null,
                          h('td', { colSpan: 5, style: { padding: '20px', background: 'rgba(0, 0, 0, 0.02)' }},
                            // 4-stat breakdown
                            h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '10px', marginBottom: '16px' }},
                              h('div', { style: { padding: '12px', background: 'rgba(40, 167, 69, 0.08)', borderRadius: '10px', textAlign: 'center' }},
                                h('div', { style: { fontSize: '22px', fontWeight: '700', color: '#28a745' }}, unsentNumbers.sent.length),
                                h('div', { style: { fontSize: '12px', color: '#28a745' }}, 'Sent')
                              ),
                              h('div', { style: { padding: '12px', background: 'rgba(0, 122, 255, 0.08)', borderRadius: '10px', textAlign: 'center' }},
                                h('div', { style: { fontSize: '22px', fontWeight: '700', color: '#007AFF' }}, (unsentNumbers.sending || []).length),
                                h('div', { style: { fontSize: '12px', color: '#007AFF' }}, 'Sending')
                              ),
                              h('div', { style: { padding: '12px', background: 'rgba(240, 173, 78, 0.08)', borderRadius: '10px', textAlign: 'center' }},
                                h('div', { style: { fontSize: '22px', fontWeight: '700', color: '#f0ad4e' }}, (unsentNumbers.queued || []).length),
                                h('div', { style: { fontSize: '12px', color: '#f0ad4e' }}, 'Queued')
                              ),
                              h('div', { style: { padding: '12px', background: 'rgba(220, 53, 69, 0.08)', borderRadius: '10px', textAlign: 'center' }},
                                h('div', { style: { fontSize: '22px', fontWeight: '700', color: '#dc3545' }}, (unsentNumbers.failed || []).length),
                                h('div', { style: { fontSize: '12px', color: '#dc3545' }}, 'Failed')
                              )
                            ),

                            unsentNumbers.unsent.length > 0 && h('div', null,
                              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }},
                                h('span', { style: { fontSize: '14px', fontWeight: '600', color: '#333' }}, 'Remaining Numbers (' + unsentNumbers.unsent.length + ')'),
                                h('div', { style: { display: 'flex', gap: '8px' }},
                                  h('button', {
                                    onClick: () => copyToClipboard(unsentNumbers.unsent.join('\n')),
                                    style: { ...blueBtn, padding: '6px 14px', fontSize: '12px' }
                                  }, 'Copy All'),
                                  h('button', {
                                    onClick: () => window.markBatchFailedContacts(unsentNumbers.batchId),
                                    style: { ...secondaryBtn, padding: '6px 14px', fontSize: '12px', color: '#f0ad4e' }
                                  }, 'Mark as Undeliverable')
                                )
                              ),
                              h('textarea', {
                                readOnly: true,
                                value: unsentNumbers.unsent.join('\n'),
                                style: {
                                  width: '100%',
                                  height: '140px',
                                  padding: '10px',
                                  background: 'rgba(255, 255, 255, 0.8)',
                                  border: '1px solid rgba(0, 0, 0, 0.1)',
                                  borderRadius: '10px',
                                  fontSize: '13px',
                                  fontFamily: 'monospace',
                                  resize: 'vertical'
                                }
                              }),
                              h('p', { style: { marginTop: '8px', fontSize: '12px', color: '#888' }},
                                'Tip: Click "Copy All" then paste into Quick Send tab')
                            ),

                            unsentNumbers.unsent.length === 0 && h('div', {
                              style: { padding: '20px', textAlign: 'center', color: '#28a745', fontSize: '15px', fontWeight: '600' }
                            }, 'All messages sent successfully!')
                          )
                        )
                      ))
                    )
                  )
            )
          );
        }

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false, error: null }; }
          static getDerivedStateFromError(error) { return { hasError: true, error }; }
          componentDidCatch(error, info) { console.error('React Error:', error, info); }
          render() {
            if (this.state.hasError) {
              return h('div', { style: { padding: '40px', textAlign: 'center' }},
                h('h2', { style: { color: '#FF3B30', marginBottom: '16px' }}, 'Something went wrong'),
                h('p', { style: { color: '#666', marginBottom: '12px' }}, this.state.error?.message || 'Unknown error'),
                h('button', { onClick: () => { this.setState({ hasError: false, error: null }); }, style: { padding: '10px 20px', background: '#007AFF', color: 'white', border: 'none', borderRadius: '10px', cursor: 'pointer' }}, 'Try Again')
              );
            }
            return this.props.children;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ErrorBoundary, null, h(App)));
    </script>
</body>
</html>
